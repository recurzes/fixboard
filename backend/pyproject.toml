[project]
name = "fixboard-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "phonenumbers>=9.0.42",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "sentry-sdk>=2.73.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
