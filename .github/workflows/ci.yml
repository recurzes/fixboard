name: CI

on: push

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://fixboard:fixboard@localhost:5432/fixboard
      NEON_AUTH_URL: https://test.neon.invalid/neondb/auth
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixboard
          POSTGRES_PASSWORD: fixboard
          POSTGRES_DB: fixboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixboard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
