name: CI

on: push

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://fixboard:fixboard@localhost:5432/fixboard
      APP_ORIGIN: https://app.test.invalid
      NEON_AUTH_URL: https://test.neon.invalid/neondb/auth
      STORAGE_ENDPOINT_URL: https://storage.test.invalid
      STORAGE_BUCKET: photos
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixboard
          POSTGRES_PASSWORD: fixboard
          POSTGRES_DB: fixboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixboard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
