services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fixboard
      POSTGRES_PASSWORD: fixboard
      POSTGRES_DB: fixboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixboard"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fixboard:fixboard@db:5432/fixboard
      NEON_AUTH_URL: ${NEON_AUTH_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
